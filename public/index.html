<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
        --color-primary: #da373d;
      }
      .nunito-sans {
        font-family: "Nunito", sans-serif;
        font-optical-sizing: auto;
        font-weight: 300;
        font-style: normal;
    }

    .bubbles {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        z-index: 0;
    }

    .bubbles span {
        position: absolute;
        bottom: -15vh;
        width: var(--size);
        height: var(--size);
        left: var(--left);
        border-radius: 9999px;
        background: radial-gradient(circle at 30% 30%, rgb(255 255 255 / 0.9), rgb(218 55 61 / 0.18) 60%, rgb(218 55 61 / 0.28));
        box-shadow: inset 0 0 10px rgb(218 55 61 / 0.15);
        opacity: 0;
        animation: bubble-rise var(--duration) ease-in infinite;
        animation-delay: var(--delay);
    }

    @keyframes bubble-rise {
        0% { transform: translate(0, 0) scale(0.8); opacity: 0; }
        10% { opacity: 0.8; }
        50% { transform: translate(clamp(-20px, -2vw, -8px), -60vh) scale(1); }
        90% { opacity: 0.6; }
        100% { transform: translate(clamp(8px, 2vw, 20px), -125vh) scale(1.05); opacity: 0; }
    }

    /* Fewer, smaller bubbles on phones */
    @media (max-width: 767px) {
        .bubbles span:nth-child(n+7) { display: none; }
        .bubbles span { width: calc(var(--size) * 0.7); height: calc(var(--size) * 0.7); }
    }

    @media (prefers-reduced-motion: reduce) {
        .bubbles span { animation: none; opacity: 0.5; bottom: var(--rest, 20%); }
    }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
</head>

<body class="nunito-sans">
    <div class="flex flex-col md:flex-row min-h-dvh bg-white">
        <img src="/elder2.jpeg" alt="" class="w-full md:w-auto h-200 min-h-dvh md:h-dvh bg-top object-cover md:object-contain shrink-0">
        <div class="relative flex-1 px-1 md:px-2">
            <div class="bubbles" aria-hidden="true">
                <span style="--size:40px;--left:5%;--duration:14s;--delay:0s;--rest:10%"></span>
                <span style="--size:22px;--left:18%;--duration:11s;--delay:3s;--rest:60%"></span>
                <span style="--size:56px;--left:32%;--duration:18s;--delay:6s;--rest:35%"></span>
                <span style="--size:28px;--left:50%;--duration:12s;--delay:1s;--rest:80%"></span>
                <span style="--size:46px;--left:68%;--duration:16s;--delay:8s;--rest:15%"></span>
                <span style="--size:18px;--left:85%;--duration:10s;--delay:4s;--rest:50%"></span>
                <span style="--size:34px;--left:93%;--duration:15s;--delay:10s;--rest:70%"></span>
                <span style="--size:24px;--left:42%;--duration:13s;--delay:12s;--rest:25%"></span>
                <span style="--size:60px;--left:76%;--duration:20s;--delay:2s;--rest:88%"></span>
                <span style="--size:20px;--left:10%;--duration:12s;--delay:7s;--rest:45%"></span>
            </div>
            <div class="relative z-10 w-full max-w-2xl px-2 md:px-4 py-5 rounded-xl mx-auto space-y-3 -mt-130 md:mt-0 bg-white md:bg-transparent">
                <div>
                    <img src="/gmail.png" alt="gmail" class="size-6">
                    <div class="font-medium text-sm">Kindly send your goodwill message to</div>
                    <div class="font-bold text-2xl">Elder Ekeoma's Igbotomma 2026</div>
                </div>
                <div class="">
                    <form>
                        <textarea name=""
                            class="w-full border border-gray-300 rounded-lg p-2 outline-none resize-none h-40 md:h-80 shadow-md"
                            placeholder="Type your message here..." id=""></textarea>
                        <div
                            class="error-message text-red-500 bg-red-100/50 border border-red-300 my-3 p-3 rounded-md text-xs font-medium hidden">
                        </div>
                        <div
                            class="good-message text-green-500 bg-green-100/50 border border-green-300 my-3 p-3 rounded-md text-xs font-medium hidden">
                        </div>
                        <div class="size-fit ml-auto">
                            <button
                                class="button bg-primary px-4 py-2 text-white rounded-md cursor-pointer active:scale-95 transition-all">Send
                                your message</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="form.js"></script>
</body>

</html>
